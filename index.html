    <script>
        const courses = [
            {
                id: 1,
                name: `進階數學`,
                teacher: `張老師`,
                code: `MATH101`,
                color: `#1967D2`,
                announcements: [
                    { title: `期中考試通知`, content: `期中考試將於下週三舉行，範圍為第1-5章。`, date: `2024-01-15` },
                    { title: `作業提醒`, content: `請記得繳交本週的作業，截止日期為週五。`, date: `2024-01-10` }
                ],
                assignments: [
                    { id: 1, title: `第三章習題`, dueDate: `2024-01-20`, points: 100, status: `pending` },
                    { id: 2, title: `期中報告`, dueDate: `2024-01-25`, points: 200, status: `submitted` }
                ],
                members: [
                    { name: `張老師`, role: `teacher` },
                    { name: `王小明`, role: `student` },
                    { name: `李小華`, role: `student` }
                ]
            },
            {
                id: 2,
                name: `基礎物理`,
                teacher: `李老師`,
                code: `PHY101`,
                color: `#E91E63`,
                announcements: [
                    { title: `實驗課安排`, content: `下週的實驗課將在物理實驗室進行。`, date: `2024-01-12` }
                ],
                assignments: [
                    { id: 3, title: `牛頓定律作業`, dueDate: `2024-01-18`, points: 100, status: `pending` }
                ],
                members: [
                    { name: `李老師`, role: `teacher` },
                    { name: `王小明`, role: `student` }
                ]
            },
            {
                id: 3,
                name: `英文寫作`,
                teacher: `陳老師`,
                code: `ENG201`,
                color: `#00BCD4`,
                announcements: [],
                assignments: [
                    { id: 4, title: `短文寫作`, dueDate: `2024-01-22`, points: 150, status: `pending` }
                ],
                members: [
                    { name: `陳老師`, role: `teacher` },
                    { name: `李小華`, role: `student` }
                ]
            },
            {
                id: 4,
                name: `程式設計入門`,
                teacher: `林老師`,
                code: `CS101`,
                color: `#4CAF50`,
                announcements: [
                    { title: `專題發表`, content: `期末專題發表將於下個月舉行。`, date: `2024-01-08` }
                ],
                assignments: [
                    { id: 5, title: `Python 基礎練習`, dueDate: `2024-01-19`, points: 100, status: `submitted` },
                    { id: 6, title: `演算法作業`, dueDate: `2024-01-26`, points: 150, status: `pending` }
                ],
                members: [
                    { name: `林老師`, role: `teacher` },
                    { name: `王小明`, role: `student` },
                    { name: `李小華`, role: `student` }
                ]
            },
            {
                id: 5,
                name: `世界歷史`,
                teacher: `黃老師`,
                code: `HIS101`,
                color: `#FF9800`,
                announcements: [],
                assignments: [
                    { id: 7, title: `歷史報告`, dueDate: `2024-01-24`, points: 200, status: `pending` }
                ],
                members: [
                    { name: `黃老師`, role: `teacher` },
                    { name: `王小明`, role: `student` }
                ]
            },
            {
                id: 6,
                name: `化學實驗`,
                teacher: `吳老師`,
                code: `CHEM101`,
                color: `#9C27B0`,
                announcements: [
                    { title: `安全須知`, content: `實驗課請務必穿著實驗衣並遵守安全規範。`, date: `2024-01-05` }
                ],
                assignments: [
                    { id: 8, title: `實驗報告一`, dueDate: `2024-01-21`, points: 100, status: `submitted` }
                ],
                members: [
                    { name: `吳老師`, role: `teacher` },
                    { name: `李小華`, role: `student` }
                ]
            }
        ];

        let currentUser = {
            role: `teacher`,
            name: `張老師`
        };

        let currentCourse = null;
        let currentAssignment = null;

        function renderCourses() {
            const grid = document.getElementById(`courseGrid`);
            grid.innerHTML = courses.map(course => `
                <div class="card course-card" onclick="openCourse(${course.id})">
                    <div class="course-header" style="background: ${course.color};">
                        <div>
                            <div class="course-title">${course.name}</div>
                            <div class="course-teacher">${course.teacher}</div>
                        </div>
                    </div>
                    <div class="course-body">
                        <div>
                            <div style="color: #5f6368; font-size: 12px; margin-bottom: 4px;">課程代碼</div>
                            <div class="course-code" style="font-size: 14px; font-weight: 500;">${course.code}</div>
                        </div>
                        <div style="display: flex; justify-content: space-between; align-items: center;">
                            <span style="color: #5f6368; font-size: 12px;">${course.assignments.length} 個作業</span>
                            <button class="icon-btn" style="color: #5f6368;" onclick="event.stopPropagation();">
                                <span class="material-icons">more_vert</span>
                            </button>
                        </div>
                    </div>
                </div>
            `).join(``);
        }

        function openCourse(courseId) {
            currentCourse = courses.find(c => c.id === courseId);
            const page = document.getElementById(`courseDetailPage`);
            
            page.innerHTML = `
                <div class="card" style="margin-bottom: 24px;">
                    <div class="course-banner" style="background: linear-gradient(135deg, ${currentCourse.color} 0%, ${currentCourse.color}dd 100%);">
                        <div class="course-detail-title">${currentCourse.name}</div>
                        <div class="course-detail-teacher">${currentCourse.teacher}</div>
                    </div>
                    <div class="tabs">
                        <div class="tab active" onclick="switchTab(event, 'stream')">動態消息</div>
                        <div class="tab" onclick="switchTab(event, 'classwork')">課堂作業</div>
                        <div class="tab" onclick="switchTab(event, 'people')">成員</div>
                    </div>
                    <div style="padding: 24px;">
                        <div class="tab-content active" id="streamTab">
                            ${currentCourse.announcements.length > 0 ? currentCourse.announcements.map(ann => `
                                <div class="card announcement-card">
                                    <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 12px;">
                                        <div class="avatar">${currentCourse.teacher[0]}</div>
                                        <div>
                                            <div style="font-weight: 500;">${currentCourse.teacher}</div>
                                            <div style="font-size: 12px; color: #5f6368;">${ann.date}</div>
                                        </div>
                                    </div>
                                    <div style="font-size: 18px; font-weight: 500; margin-bottom: 8px;">${ann.title}</div>
                                    <div style="color: #5f6368;">${ann.content}</div>
                                </div>
                            `).join(``) : `<p style="color: #5f6368; text-align: center; padding: 40px;">目前沒有公告</p>`}
                        </div>
                        <div class="tab-content" id="classworkTab">
                            ${currentUser.role === `teacher` ? `
                                <button class="btn-primary" onclick="openCreateAssignment()" style="margin-bottom: 16px;">
                                    <span class="material-icons" style="vertical-align: middle; margin-right: 4px;">add</span>
                                    建立作業
                                </button>
                            ` : ``}
                            <div class="card">
                                ${currentCourse.assignments.map(assignment => `
                                    <div class="assignment-item" onclick="openAssignment(${assignment.id})">
                                        <div style="display: flex; justify-content: space-between; align-items: center;">
                                            <div style="display: flex; align-items: center; gap: 12px;">
                                                <span class="material-icons" style="color: #1967D2;">assignment</span>
                                                <div>
                                                    <div style="font-weight: 500;">${assignment.title}</div>
                                                    <div style="font-size: 12px; color: #5f6368;">截止日期：${assignment.dueDate}</div>
                                                </div>
                                            </div>
                                            <div style="display: flex; align-items: center; gap: 16px;">
                                                <span class="badge ${assignment.status === `submitted` ? `badge-success` : `badge-warning`}">
                                                    ${assignment.status === `submitted` ? `已繳交` : `待繳交`}
                                                </span>
                                                <span style="color: #5f6368;">${assignment.points} 分</span>
                                            </div>
                                        </div>
                                    </div>
                                `).join(``)}
                            </div>
                        </div>
                        <div class="tab-content" id="peopleTab">
                            <div class="card">
                                <div style="padding: 16px; border-bottom: 1px solid #e0e0e0;">
                                    <div style="font-weight: 500; color: #1967D2;">教師</div>
                                </div>
                                ${currentCourse.members.filter(m => m.role === `teacher`).map(member => `
                                    <div class="member-item">
                                        <div class="avatar">${member.name[0]}</div>
                                        <div style="flex: 1;">
                                            <div style="font-weight: 500;">${member.name}</div>
                                        </div>
                                    </div>
                                `).join(``)}
                                <div style="padding: 16px; border-bottom: 1px solid #e0e0e0; margin-top: 16px;">
                                    <div style="font-weight: 500; color: #1967D2;">學生 (${currentCourse.members.filter(m => m.role === `student`).length})</div>
                                </div>
                                ${currentCourse.members.filter(m => m.role === `student`).map(member => `
                                    <div class="member-item">
                                        <div class="avatar">${member.name[0]}</div>
                                        <div style="flex: 1;">
                                            <div style="font-weight: 500;">${member.name}</div>
                                        </div>
                                    </div>
                                `).join(``)}
                            </div>
                        </div>
                    </div>
                </div>
            `;

            document.getElementById(`coursesPage`).style.display = `none`;
            page.style.display = `block`;
        }

        function openAssignment(assignmentId) {
            const assignment = currentCourse.assignments.find(a => a.id === assignmentId);
            currentAssignment = assignment;
            const page = document.getElementById(`assignmentDetailPage`);

            page.innerHTML = `
                <div class="card" style="max-width: 900px; margin: 0 auto;">
                    <div style="padding: 24px; border-bottom: 1px solid #e0e0e0;">
                        <button class="btn-secondary" onclick="backToCourse()" style="margin-bottom: 16px;">
                            <span class="material-icons" style="vertical-align: middle; margin-right: 4px;">arrow_back</span>
                            返回課程
                        </button>
                        <h2 style="font-size: 28px; font-weight: 500; margin-bottom: 8px;">${assignment.title}</h2>
                        <div style="display: flex; gap: 24px; color: #5f6368; font-size: 14px;">
                            <span><span class="material-icons" style="vertical-align: middle; font-size: 18px;">event</span> 截止日期：${assignment.dueDate}</span>
                            <span><span class="material-icons" style="vertical-align: middle; font-size: 18px;">grade</span> 配分：${assignment.points} 分</span>
                        </div>
                    </div>
                    <div style="padding: 24px;">
                        <div style="margin-bottom: 32px;">
                            <h3 style="font-size: 18px; font-weight: 500; margin-bottom: 12px;">作業說明</h3>
                            <p style="color: #5f6368; line-height: 1.6;">這是一份關於${assignment.title}的作業。請仔細閱讀題目並按時繳交。</p>
                        </div>
                        ${currentUser.role === `student` ? `
                            <div style="margin-bottom: 32px;">
                                <h3 style="font-size: 18px; font-weight: 500; margin-bottom: 12px;">你的作業</h3>
                                ${assignment.status === `submitted` ? `
                                    <div class="card" style="background: #e6f4ea; border: 1px solid #1e8e3e; padding: 16px;">
                                        <div style="display: flex; align-items: center; gap: 8px; color: #1e8e3e;">
                                            <span class="material-icons">check_circle</span>
                                            <span style="font-weight: 500;">已繳交</span>
                                        </div>
                                    </div>
                                ` : `
                                    <div class="file-upload-area" style="margin-bottom: 16px;">
                                        <span class="material-icons" style="font-size: 48px; color: #5f6368;">cloud_upload</span>
                                        <div style="margin-top: 8px; color: #5f6368;">上傳作業檔案</div>
                                    </div>
                                    <button class="btn-primary" onclick="submitAssignment()">繳交作業</button>
                                `}
                            </div>
                        ` : `
                            <div>
                                <h3 style="font-size: 18px; font-weight: 500; margin-bottom: 12px;">學生繳交狀況</h3>
                                <div class="card" style="padding: 16px;">
                                    <div style="display: flex; justify-content: space-around; text-align: center;">
                                        <div>
                                            <div style="font-size: 32px; font-weight: 500; color: #1e8e3e;">2</div>
                                            <div style="color: #5f6368; font-size: 14px;">已繳交</div>
                                        </div>
                                        <div>
                                            <div style="font-size: 32px; font-weight: 500; color: #f9ab00;">1</div>
                                            <div style="color: #5f6368; font-size: 14px;">待繳交</div>
                                        </div>
                                        <div>
                                            <div style="font-size: 32px; font-weight: 500; color: #5f6368;">3</div>
                                            <div style="color: #5f6368; font-size: 14px;">總人數</div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        `}
                    </div>
                </div>
            `;

            document.getElementById(`courseDetailPage`).style.display = `none`;
            page.style.display = `block`;
        }

        function backToCourse() {
            document.getElementById(`assignmentDetailPage`).style.display = `none`;
            document.getElementById(`courseDetailPage`).style.display = `block`;
        }

        function openCreateAssignment() {
            document.getElementById(`courseDetailPage`).style.display = `none`;
            document.getElementById(`createAssignmentPage`).style.display = `block`;
        }

        function submitAssignment() {
            alert(`作業已成功繳交！`);
            currentAssignment.status = `submitted`;
            openAssignment(currentAssignment.id);
        }

        function switchTab(event, tabName) {
            document.querySelectorAll(`.tab`).forEach(tab => tab.classList.remove(`active`));
            event.target.classList.add(`active`);

            document.querySelectorAll(`.tab-content`).forEach(content => content.classList.remove(`active`));
            document.getElementById(`${tabName}Tab`).classList.add(`active`);
        }

        function openModal(modalId) {
            document.getElementById(modalId).classList.add(`active`);
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove(`active`);
        }

        function switchPage(pageName) {
            document.querySelectorAll(`.content-page`).forEach(page => page.style.display = `none`);
            document.getElementById(`${pageName}Page`).style.display = `block`;

            document.querySelectorAll(`.sidebar-item`).forEach(item => item.classList.remove(`active`));
            document.querySelector(`[data-page="${pageName}"]`).classList.add(`active`);
        }

        function renderTodoList() {
            const todoList = document.getElementById(`todoList`);
            const allAssignments = courses.flatMap(course => 
                course.assignments.filter(a => a.status === `pending`).map(a => ({
                    ...a,
                    courseName: course.name
                }))
            );

            if (allAssignments.length === 0) {
                todoList.innerHTML = `<p style="color: #5f6368; text-align: center; padding: 40px;">沒有待辦事項</p>`;
            } else {
                todoList.innerHTML = allAssignments.map(assignment => `
                    <div class="assignment-item">
                        <div style="display: flex; justify-content: space-between; align-items: center;">
                            <div>
                                <div style="font-weight: 500;">${assignment.title}</div>
                                <div style="font-size: 12px; color: #5f6368;">${assignment.courseName} • 截止日期：${assignment.dueDate}</div>
                            </div>
                            <span class="badge badge-warning">待繳交</span>
                        </div>
                    </div>
                `).join(``);
            }
        }

        document.getElementById(`loginForm`).addEventListener(`submit`, function(e) {
            e.preventDefault();
            const selectedRole = document.querySelector(`.role-btn.active`).dataset.role;
            currentUser.role = selectedRole;
            currentUser.name = selectedRole === `teacher` ? `張老師` : `王小明`;

            document.getElementById(`loginPage`).classList.remove(`active`);
            document.getElementById(`mainApp`).classList.add(`active`);

            renderCourses();
            renderTodoList();

            const createBtn = document.getElementById(`createCourseBtn`);
            const joinBtn = document.getElementById(`joinCourseBtn`);
            if (selectedRole === `student`) {
                createBtn.style.display = `none`;
            } else {
                createBtn.style.display = `flex`;
            }
        });

        document.querySelectorAll(`.role-btn`).forEach(btn => {
            btn.addEventListener(`click`, function() {
                document.querySelectorAll(`.role-btn`).forEach(b => b.classList.remove(`active`));
                this.classList.add(`active`);
            });
        });

        document.getElementById(`menuToggle`).addEventListener(`click`, function() {
            const sidebar = document.getElementById(`sidebar`);
            const mainContent = document.getElementById(`mainContent`);
            
            if (window.innerWidth <= 768) {
                sidebar.classList.toggle(`mobile-open`);
            } else {
                sidebar.classList.toggle(`collapsed`);
                mainContent.classList.toggle(`expanded`);
            }
        });

        document.querySelectorAll(`.sidebar-item`).forEach(item => {
            item.addEventListener(`click`, function() {
                const pageName = this.dataset.page;
                switchPage(pageName);
            });
        });

        document.getElementById(`createCourseBtn`).addEventListener(`click`, function() {
            openModal(`createCourseModal`);
        });

        document.getElementById(`joinCourseBtn`).addEventListener(`click`, function() {
            openModal(`joinCourseModal`);
        });

        document.getElementById(`createCourseForm`).addEventListener(`submit`, function(e) {
            e.preventDefault();
            const formData = new FormData(e.target);
            const courseName = formData.get(`courseName`) || e.target[0].value;
            
            const newCourse = {
                id: courses.length + 1,
                name: courseName,
                teacher: currentUser.name,
                code: `COURSE${Math.floor(Math.random() * 1000)}`,
                color: `#${Math.floor(Math.random()*16777215).toString(16)}`,
                announcements: [],
                assignments: [],
                members: [{ name: currentUser.name, role: `teacher` }]
            };

            courses.push(newCourse);
            renderCourses();
            closeModal(`createCourseModal`);
            e.target.reset();
            alert(`課程已成功創建！`);
        });

        document.getElementById(`joinCourseForm`).addEventListener(`submit`, function(e) {
            e.preventDefault();
            closeModal(`joinCourseModal`);
            e.target.reset();
            alert(`已成功加入課程！`);
        });

        document.getElementById(`createAssignmentForm`).addEventListener(`submit`, function(e) {
            e.preventDefault();
            alert(`作業已成功創建！`);
            document.getElementById(`createAssignmentPage`).style.display = `none`;
            document.getElementById(`courseDetailPage`).style.display = `block`;
            openCourse(currentCourse.id);
        });

        document.getElementById(`cancelCreateAssignment`).addEventListener(`click`, function() {
            document.getElementById(`createAssignmentPage`).style.display = `none`;
            document.getElementById(`courseDetailPage`).style.display = `block`;
        });

        document.getElementById(`logoutBtn`).addEventListener(`click`, function() {
            if (confirm(`確定要登出嗎？`)) {
                document.getElementById(`mainApp`).classList.remove(`active`);
                document.getElementById(`loginPage`).classList.add(`active`);
                document.getElementById(`coursesPage`).style.display = `block`;
                document.getElementById(`courseDetailPage`).style.display = `none`;
                document.getElementById(`assignmentDetailPage`).style.display = `none`;
            }
        });

        window.addEventListener(`click`, function(e) {
            const modals = document.querySelectorAll(`.modal`);
            modals.forEach(modal => {
                if (e.target === modal) {
                    modal.classList.remove(`active`);
                }
            });
        });

        renderCourses();
    </script>
    <script src="https://cdn.kuse.ai/sdk.prd.js"></script>
</body>
</html>
