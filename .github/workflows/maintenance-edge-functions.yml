name: Maintenance Edge Function Checks
# Includes disposable PostgreSQL 17 checks for default ACLs and trigger side effects.

on:
  workflow_dispatch:
  push:
    branches:
      - feature/maintenance-system
    paths:
      - "config.js"
      - "maintenance-client.js"
      - "admin.js"
      - "admin.html"
      - "tests/test_maintenance_feature_gate.py"
      - "config.js"
      - "maintenance-client.js"
      - "admin.js"
      - "admin.html"
      - "tests/test_maintenance_feature_gate.py"
      - "supabase/functions/**"
      - "supabase/tests/functions/**"
      - "supabase/tests/sql/**"
      - "tests/test_verify_maintenance_sql_draft.py"
      - "scripts/verify_maintenance_sql_draft.py"
      - "supabase/sql/**"
      - "supabase/migrations/**"
      - "supabase/tests/sql/growth-function-authorization.test.sql"
      - ".github/workflows/maintenance-edge-functions.yml"
  pull_request:
    paths:
      - "app.js"
      - "my.html"
      - "tests/test_notifications_contract.py"
      - "docs/activity-member-stats-release-and-rollback-plan.md"
      - "docs/production-database-baseline-and-migration-reconciliation-2026-11-18.md"
      - "supabase/functions/**"
      - "supabase/tests/functions/**"
      - "supabase/tests/sql/**"
      - "supabase/sql/**"
      - "supabase/migrations/**"
      - "supabase/tests/sql/growth-function-authorization.test.sql"
      - ".github/workflows/maintenance-edge-functions.yml"

permissions:
  contents: read

jobs:
  maintenance-edge-functions:
    name: Deno type check and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check browser JavaScript syntax
        run: node --check app.js

      - name: Run notification page contract tests
        run: python -m unittest discover -s tests -p 'test_notifications_contract.py' -v

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check maintenance Edge Functions and tests
        run: |
          deno check \
            supabase/functions/maintenance-status/index.ts \
            supabase/functions/maintenance-admin-list/index.ts \
            supabase/functions/maintenance-event-create/index.ts \
            supabase/functions/maintenance-event-update/index.ts \
            supabase/functions/maintenance-event-action/index.ts \
            supabase/tests/functions/maintenance-validation.test.ts

      - name: Run maintenance validation tests
        run: deno test --allow-env=MAINTENANCE_ALLOWED_ORIGINS supabase/tests/functions/maintenance-validation.test.ts

      - name: Test maintenance feature gate
        run: python -m unittest discover -s tests -p 'test_maintenance_feature_gate.py'

      - name: Run maintenance SQL static guardrails
        run: python scripts/verify_maintenance_sql_draft.py

      - name: Test maintenance SQL static guardrails
        run: python -m unittest discover -s tests -p 'test_verify_maintenance_sql_draft.py'

  maintenance-gotrue-postgrest-integration:
    name: GoTrue-issued JWT and PostgREST integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: maintenance_gotrue_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d maintenance_gotrue_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare disposable PostgreSQL extensions for GoTrue
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/maintenance_gotrue_test
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE EXTENSION IF NOT EXISTS pgcrypto;
          CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
          CREATE SCHEMA IF NOT EXISTS auth;
          ALTER ROLE postgres IN DATABASE maintenance_gotrue_test SET search_path = auth, public;
          SQL

      - name: Start Supabase GoTrue with automatic migrations
        run: |
          docker run --detach --network host --name maintenance-gotrue \
            --env GOTRUE_SITE_URL=http://localhost:3000 \
            --env GOTRUE_API_HOST=127.0.0.1 \
            --env PORT=9999 \
            --env API_EXTERNAL_URL=http://localhost:9999 \
            --env GOTRUE_DB_DRIVER=postgres \
            --env DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5432/maintenance_gotrue_test?sslmode=disable \
            --env GOTRUE_JWT_SECRET=maintenance-gotrue-ci-secret-at-least-32-bytes-long \
            --env GOTRUE_JWT_EXP=3600 \
            --env GOTRUE_JWT_AUD=authenticated \
            --env GOTRUE_JWT_DEFAULT_GROUP_NAME=authenticated \
            --env GOTRUE_EXTERNAL_EMAIL_ENABLED=true \
            --env GOTRUE_MAILER_AUTOCONFIRM=true \
            supabase/gotrue:v2.197.0

      - name: Wait for GoTrue schema migrations to finish
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/maintenance_gotrue_test
        run: |
          for attempt in $(seq 1 60); do
            ready=$(psql "$DATABASE_URL" -Atqc "SELECT to_regclass('auth.identities') IS NOT NULL AND to_regclass('auth.schema_migrations') IS NOT NULL" 2>/dev/null || true)
            if [ "$ready" = "t" ]; then
              echo 'GoTrue schema migrations are complete'
              exit 0
            fi
            sleep 2
          done
          docker logs maintenance-gotrue
          echo 'GoTrue schema migrations did not complete' >&2
          exit 1

      - name: Wait for GoTrue migrations and API
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:9999/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs maintenance-gotrue
          echo 'GoTrue did not become healthy' >&2
          exit 1

      - name: Provision isolated users through GoTrue signup
        env:
          GOTRUE_URL: http://localhost:9999
        run: python supabase/tests/sql/provision_gotrue_users.py

      - name: Create isolated profiles and admin helper
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/maintenance_gotrue_test
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
            -v admin_id="$TEST_ADMIN_ID" \
            -v member_id="$TEST_MEMBER_ID" \
            -f supabase/tests/sql/maintenance-gotrue-bootstrap.sql

      - name: Apply maintenance SQL draft to disposable GoTrue database
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/maintenance_gotrue_test
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261117121103_maintenance_system_initial.sql

      - name: Start PostgREST against GoTrue database
        run: |
          docker run --detach --network host --name maintenance-gotrue-postgrest \
            --env PGRST_DB_URI=postgres://authenticator:authenticator@127.0.0.1:5432/maintenance_gotrue_test \
            --env PGRST_DB_SCHEMAS=public \
            --env PGRST_DB_ANON_ROLE=anon \
            --env PGRST_JWT_SECRET=maintenance-gotrue-ci-secret-at-least-32-bytes-long \
            --env PGRST_SERVER_PORT=3000 \
            postgrest/postgrest:v12.2.3

      - name: Wait for PostgREST schema cache
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:3000/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs maintenance-gotrue-postgrest
          echo 'PostgREST did not become ready' >&2
          exit 1

      - name: Verify GoTrue-issued JWT, roles, RPC, RLS and concurrency
        env:
          GOTRUE_URL: http://localhost:9999
          POSTGREST_URL: http://localhost:3000
        run: python supabase/tests/sql/test_gotrue_postgrest_integration.py

  maintenance-postgres-integration:
    name: Isolated PostgreSQL RPC and RLS tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: maintenance_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d maintenance_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply draft and run isolated PostgreSQL integration checks
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/maintenance_test
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f supabase/tests/sql/maintenance-postgres-isolated.test.sql

      - name: Run growth function authorization regression tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/maintenance_test
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE DATABASE growth_function_authorization_test"
          psql postgresql://postgres:postgres@localhost:5432/growth_function_authorization_test \
            -v ON_ERROR_STOP=1 \
            -f supabase/tests/sql/growth-function-authorization.test.sql
      - name: Run default privileges and trigger side-effect regression tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/maintenance_test
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE DATABASE default_privileges_trigger_test"
          psql postgresql://postgres:postgres@localhost:5432/default_privileges_trigger_test \
            -v ON_ERROR_STOP=1 \
            -f supabase/tests/sql/default-privileges-trigger-hardening.test.sql

      - name: Run admin growth reward NULL-auth regression test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/maintenance_test
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE DATABASE admin_growth_reward_auth_test"
          TEST_DATABASE_URL=postgresql://postgres:postgres@localhost:5432/admin_growth_reward_auth_test
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/tests/sql/admin-growth-reward-null-auth-guard.setup.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/202611250002_admin_growth_reward_null_auth_guard.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/tests/sql/admin-growth-reward-null-auth-guard.test.sql

      - name: Run protected profile growth update regression test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/maintenance_test
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE DATABASE protected_profile_growth_test"
          psql postgresql://postgres:postgres@localhost:5432/protected_profile_growth_test \
            -v ON_ERROR_STOP=1 \
            -f supabase/tests/sql/protected-profile-growth-update.test.sql

      - name: Run sequential growth and default-privilege integration test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/maintenance_test
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE DATABASE growth_default_sequential_test"
          psql postgresql://postgres:postgres@localhost:5432/growth_default_sequential_test \
            -v ON_ERROR_STOP=1 \
            -f supabase/tests/sql/growth-and-default-privileges-sequential.test.sql

      - name: Run activity_member_stats view security integration tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/maintenance_test
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE DATABASE activity_member_stats_test"
          TEST_DATABASE_URL=postgresql://postgres:postgres@localhost:5432/activity_member_stats_test
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/tests/sql/activity_member_stats_view_hardening_setup.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/candidate_sql/activity_member_stats_view_hardening.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/candidate_sql/activity_public_leaderboard_view.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/tests/sql/activity_member_stats_view_hardening.test.sql

      - name: Start PostgREST after database roles are provisioned
        run: |
          docker run --detach --network host --name maintenance-postgrest \
            --env PGRST_DB_URI=postgres://authenticator:authenticator@127.0.0.1:5432/maintenance_test \
            --env PGRST_DB_SCHEMAS=public \
            --env PGRST_DB_ANON_ROLE=anon \
            --env PGRST_JWT_SECRET=maintenance-ci-only-secret-key-at-least-32-bytes-long \
            --env PGRST_SERVER_PORT=3000 \
            postgrest/postgrest:v12.2.3

      - name: Wait for PostgREST
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:3000/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo 'PostgREST did not become ready' >&2
          exit 1

      - name: Verify PostgREST JWT, RPC, RLS and concurrent writes
        env:
          POSTGREST_URL: http://localhost:3000
          TEST_JWT_SECRET: maintenance-ci-only-secret-key-at-least-32-bytes-long
        run: python supabase/tests/sql/test_postgrest_jwt_rls_concurrency.py
