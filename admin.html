<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>管理後台｜商業簡介</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="adminPage">
<div id="login" class="gate">
 <div class="gate-card">
  <div class="lock">👑</div>
  <h1>管理員登入</h1>
  <p>只有管理員可以發布與管理公告</p>
  <input id="email" type="email" placeholder="管理員 Email">
  <input id="password" type="password" placeholder="管理員密碼">
  <button onclick="login()">登入後台</button>
  <small id="loginError"></small>
  <a href="index.html">← 返回網站</a>
 </div>
</div>

<div id="dashboard" class="dashboard hidden">
<header><div class="nav"><div class="logo">👑 管理後台</div>
<nav><a href="index.html">查看網站</a><button onclick="logout()">登出</button></nav>
</div></header>

<main>
<section>
<h2>發布公告</h2>
<p class="sub">新增內容後，訪客網站會同步讀取資料庫中的公告。</p>
<div class="editor">
<input id="title" placeholder="公告標題">
<input id="date" type="date">
<textarea id="content" rows="8" placeholder="公告內容"></textarea>
<button class="btn" onclick="publish()">＋ 發布公告</button>
<small id="publishMsg"></small>
</div>

<h2>已發布公告</h2>
<div id="adminList" class="newsList"></div>
</section>
</main>
</div>

<script src="config.js"></script>
<script src="admin.js"></script>
</body>
</html>
